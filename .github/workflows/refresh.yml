name: 최신글 갱신

# 두 블로그의 RSS를 읽어 index.html 을 다시 만들고, 바뀐 게 있으면 커밋합니다.
# 커밋이 push 되면 GitHub Pages 가 자동으로 다시 배포합니다.

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 (UTC 기준)
  workflow_dispatch: # Actions 탭에서 수동 실행
  push: # 생성기(build.mjs)를 고치면 바로 다시 만든다
    branches: [main]
    paths: ['build.mjs']

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 블로그 RSS 읽어 페이지 생성
        run: node build.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "최신글 자동 갱신"
            git pull --rebase -q || true
            git push
            echo "갱신했습니다."
          else
            echo "새 글이 없어 그대로 둡니다."
          fi
